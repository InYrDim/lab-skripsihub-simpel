services:
  mysql:
    image: mysql:8.4.6
    container_name: skripsihub-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: skripsihub
      MYSQL_USER: ${DB_USER:-skripsihub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the development database}
    ports:
      - "127.0.0.1:3336:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld:uid=999,gid=999,mode=0750

volumes:
  mysql_data:
