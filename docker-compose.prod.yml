services:
  mysql:
    image: mysql:8.4.6
    container_name: skripsihub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: skripsihub
      MYSQL_USER: ${DB_USER:-skripsihub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping -h localhost -u \"$${MYSQL_USER}\" --silent"]
      timeout: 20s
      retries: 10
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld:uid=999,gid=999,mode=0750

  backend:
    build:
      context: ./backend
    container_name: skripsihub-backend
    restart: always
    environment:
      DATABASE_URL: mysql://${DB_USER:-skripsihub}:${DB_PASSWORD:?Set DB_PASSWORD}@mysql:3306/skripsihub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY:?Set SUPABASE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-letters}
      SUPABASE_BUCKET_AVATAR: ${SUPABASE_BUCKET_AVATAR:-avatars}
      SUPABASE_BUCKET_PROPOSALS: ${SUPABASE_BUCKET_PROPOSALS:-proposals}
      NODE_ENV: production
      MODE: production
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL}
    container_name: skripsihub-frontend
    restart: always
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: skripsihub-cloudflared
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

volumes:
  mysql_data:
